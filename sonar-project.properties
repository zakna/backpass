# SonarQube analysis for backpass. Run it with scripts/quality-scan.sh, which
# writes every report named below into .cache/quality/ before the scan.
sonar.projectKey=zakna_backpass
sonar.projectName=backpass

sonar.sources=bin,src,scripts,templates
sonar.tests=test
sonar.exclusions=src/prompts/**
sonar.test.exclusions=test/fixtures/**
sonar.working.directory=.cache/quality/scannerwork

# Coverage from `node --test --experimental-test-coverage --test-reporter=lcov`.
sonar.javascript.lcov.reportPaths=.cache/quality/lcov.info

# Dependency vulnerabilities (OSV-Scanner) as SARIF, and mutants the tests did
# not catch (StrykerJS) as generic issues.
sonar.sarifReportPaths=.cache/quality/osv.sarif
sonar.externalIssuesReportPaths=.cache/quality/sonar-mutants.json
