packages:
  - "."

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
# Zero runtime dependencies; no dev dependency needs a build script either,
# so nothing is allowlisted and pnpm's default-deny stays fully closed.
onlyBuiltDependencies: []

# Transitive dev-only dependencies (via @stryker-mutator/core and glob): force the
# patched releases for the qs and brace-expansion advisories.
overrides:
  qs: ">=6.16.0"
  brace-expansion: ">=5.0.12"
